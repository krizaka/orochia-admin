# Orochia operator console — DEVELOPMENT (DigitalOcean App Platform, project "orochia").
# Create once:  doctl apps create --spec deploy/app-spec.dev.yaml --project-id <orochia project id>
# Secret values are entered in the app (Settings → Environment Variables), never here.
name: orochia-admin-dev
region: tor
domains:
  - domain: admin.orochia.com
    type: PRIMARY
services:
  - name: admin
    github:
      repo: krizaka/orochia-admin
      branch: main
      deploy_on_push: true
    dockerfile_path: deploy/Dockerfile
    source_dir: /
    http_port: 3001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
    routes:
      - path: /
    envs:
      # The console's own database (account, sessions, operator log).
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${admin-db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${admin-db.CA_CERT}
      # The single operator account.
      - key: AUTH_OPERATOR_EMAIL
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OPERATOR_NAME
        scope: RUN_TIME
        type: GENERAL
      - key: AUTH_OPERATOR_PASSWORD
        scope: RUN_TIME
        type: SECRET
      # Orochia's API and the service token shared with it (OPERATOR_API_TOKEN on orochia-dev).
      - key: OPERATOR_API_URL
        scope: RUN_TIME
        value: https://dev.orochia.com
      - key: NEXT_PUBLIC_OPERATOR_PLATFORM_URL
        scope: RUN_AND_BUILD_TIME
        value: https://dev.orochia.com
      # The build badge in the header: "v<version> · dev · <commit>" — never shown in production.
      - key: NEXT_PUBLIC_APP_ENV
        scope: BUILD_TIME
        value: "dev"
      - key: APP_COMMIT_SHA
        scope: BUILD_TIME
        value: ${_self.COMMIT_HASH}
      - key: OPERATOR_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      # Only these client addresses reach the console (do-connecting-ip), sign-in page included.
      - key: AUTH_ALLOWED_IPS
        scope: RUN_TIME
        type: GENERAL

databases:
  # App Platform dev database, the console's alone.
  - name: admin-db
    engine: PG
    version: "16"
